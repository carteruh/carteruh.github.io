- id: roboeval25
  title: "RoboEval: Where Robotic Manipulation Meets Structured and Scalable Evaluation"
  authors: "Yi Ru Wang, **Carter Ung**, Christopher Tan, Grant Tannert, Jiafei Duan, Josephine Li, Amy Le, Rishabh Oswal, Markus Grotz, Wilbert Pumacay, Yuquan Deng, Ranjay Krishna, Dieter Fox, Siddhartha Srinivasa"
  venue: "arXiv 2025 (Under Review)"
  badge: ""
  highlight: true            # <- makes the row yellow
  thumb: "/images/roboeval.gif"    # the file you’ll create below
  links:
    project: "https://robo-eval.github.io"
    paper:   "https://arxiv.org/pdf/2507.00435"    # replace with real URL
    code:    "https://github.com/Robo-Eval/RoboEval"
