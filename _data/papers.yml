    RoboEval introduces a unified evaluation suite covering bimanual manipulation
    tasks with fine-grained metrics so researchers can compare models beyond binary
    success/failure.


# ---  VISAPP 2025  ----------------------------------------------------------
- id: visapp25_pose
  title: "Minimizing Number of Poses for Pose-Invariant Face Recognition"
  authors: "**Carter Ung**, Pranav Mantini, Shishir Shah"
  venue: "International Conference on Computer Vision Theory and Applications (VISAPP) 2025"
  badge: ""
  thumb: "/images/framework.png"
  links:
    paper:  "https://www.scitepress.org/Papers/2025/131864/131864.pdf"
  teaser: |
    We study how many viewpoint images are truly needed for robust, pose-invariant face recognition and show that a compact pose set dramatically reduces data-collection overhead.

# ---  Under Review  ----------------------------------------------------------
- id: dualvxm25
  title: "Dual-VXM: A Prior-Aware Dual-Encoder UNet for Watch-and-Wait Monitoring with Low-Field MRI"
  authors: "Mohammad Javadi, Panagiotis Tsiamyrtzis, **Carter Ung**, Ernst Leiss, Andrew Webb, Nikolaos Tsekos"
  venue: "Under Review"
  badge: ""
  thumb: "/images/dual-vxm.gif"
  teaser: |
    We present a novel dual-encoder UNet architecture that leverages prior high-field MRI scans to enhance low-field MRI image quality for improved monitoring of Low-Grade Gliomas (LGG).

