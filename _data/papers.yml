- id: roboeval25
  title: "RoboEval: Where Robotic Manipulation Meets Structured and Scalable Evaluation"
  authors_html: 'Yi Ru Wang, <strong>Carter Ung</strong>, Christopher Tan, Grant Tannert, Jiafei Duan, Josephine Li, Amy Le, Rishabh Oswal, Markus Grotz, Wilbert Pumacay, Yuquan Deng, Ranjay Krishna, Dieter Fox<sup>&dagger;</sup>, Siddhartha Srinivasa<sup>&dagger;</sup> <br><small><sup>&dagger;</sup>Equal advising</small>'
